buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.ext {
    compileSdkVersion = 36
    minSdkVersion = 24
    targetSdkVersion = 36
}
// Expose SDK versions at root so plugins (e.g. geolocator_android) can read them
rootProject.compileSdkVersion = rootProject.ext.compileSdkVersion
rootProject.minSdkVersion = rootProject.ext.minSdkVersion
rootProject.targetSdkVersion = rootProject.ext.targetSdkVersion

subprojects { project ->
    if (project.name != "app") {
        project.ext.flutter = [
            compileSdkVersion: rootProject.ext.compileSdkVersion,
            minSdkVersion    : rootProject.ext.minSdkVersion,
            targetSdkVersion: rootProject.ext.targetSdkVersion
        ]
    }

    // Fix for motion_sensors targeting old JVM
    if (project.name == "motion_sensors") {
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "1.8"
            }
        }
    }

    project.afterEvaluate {
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion rootProject.ext.compileSdkVersion
                defaultConfig {
                    targetSdkVersion rootProject.ext.targetSdkVersion
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
