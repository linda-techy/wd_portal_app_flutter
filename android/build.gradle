buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.ext {
    compileSdkVersion = 35
    minSdkVersion = 21
    targetSdkVersion = 35
}
// Expose SDK versions at root so plugins (e.g. geolocator_android) can read them
rootProject.compileSdkVersion = rootProject.ext.compileSdkVersion
rootProject.minSdkVersion = rootProject.ext.minSdkVersion
rootProject.targetSdkVersion = rootProject.ext.targetSdkVersion

subprojects {
    project.evaluationDependsOn(":app")
}

subprojects { project ->
    project.ext.flutter = [
        compileSdkVersion: rootProject.ext.compileSdkVersion,
        minSdkVersion    : rootProject.ext.minSdkVersion,
        targetSdkVersion: rootProject.ext.targetSdkVersion
    ]

    // Fix for motion_sensors targeting old JVM
    if (project.name == "motion_sensors") {
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "1.8"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
