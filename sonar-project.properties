sonar.projectKey=wd_portal_app_flutter
sonar.projectName=WD Portal App (Flutter)

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Exclude generated / boilerplate Dart files from analysis
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.config.dart,**/firebase_options.dart,**/generated/**,**/l10n/**

# Coverage (lcov) - produced by: flutter test --coverage
sonar.dart.coverage.reportPath=coverage/lcov.info
